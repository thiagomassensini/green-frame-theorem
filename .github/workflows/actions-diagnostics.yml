name: Green Frame Actions diagnostics

on:
  pull_request:
  push:
    branches:
      - actions-diagnostics-trigger
  issues:
    types:
      - opened
      - edited
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: write

concurrency:
  group: green-frame-actions-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'DIAGNOSE GREEN FRAME ACTIONS')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect recent workflow runs and the latest publisher failure
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          runs_json="${RUNNER_TEMP}/runs.json"
          runs_txt="${RUNNER_TEMP}/runs.txt"
          publisher_detail="${RUNNER_TEMP}/publisher-detail.txt"
          body_file="${RUNNER_TEMP}/diagnostics.md"

          gh api "repos/${repo}/actions/runs?per_page=40" > "$runs_json"
          jq -r '.workflow_runs[] | [.id, .name, .path, .event, .status, (.conclusion // "-"), .head_sha, .html_url] | @tsv' \
            "$runs_json" > "$runs_txt"

          publisher_run_id="$(jq -r '.workflow_runs[] | select(.path == ".github/workflows/publish-v1.0.0.yml") | .id' "$runs_json" | head -n 1)"
          if [[ -n "$publisher_run_id" ]]; then
            {
              echo '## gh run view --verbose'
              gh run view "$publisher_run_id" --repo "$repo" --verbose 2>&1 || true
              echo
              echo '## run metadata'
              gh api "repos/${repo}/actions/runs/${publisher_run_id}" \
                --jq '{id,name,path,event,status,conclusion,display_title,head_sha,run_started_at,updated_at,jobs_url,check_suite_id,html_url}' 2>&1 || true
              echo
              echo '## jobs'
              gh api "repos/${repo}/actions/runs/${publisher_run_id}/jobs" \
                --jq '.jobs[]? | {id,name,status,conclusion,steps,html_url}' 2>&1 || true
              check_suite_id="$(gh api "repos/${repo}/actions/runs/${publisher_run_id}" --jq '.check_suite_id // empty' 2>/dev/null || true)"
              if [[ -n "$check_suite_id" ]]; then
                echo
                echo '## check-suite runs and annotations'
                gh api "repos/${repo}/check-suites/${check_suite_id}/check-runs" \
                  --jq '.check_runs[]? | {id,name,status,conclusion,output,details_url}' 2>&1 || true
              fi
            } > "$publisher_detail"
          else
            echo 'No publisher workflow run was found.' > "$publisher_detail"
          fi

          {
            echo '# Green Frame Actions diagnostics'
            echo
            echo "- Diagnostic run: ${GITHUB_SERVER_URL}/${repo}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Latest publisher run ID: \`${publisher_run_id:-none}\`"
            echo
            echo '## Recent runs'
            echo
            echo '```text'
            head -n 40 "$runs_txt"
            echo '```'
            echo
            echo '## Latest publisher validation detail'
            echo
            echo '```text'
            tail -n 260 "$publisher_detail"
            echo '```'
          } > "$body_file"

          if [[ "$GITHUB_EVENT_NAME" == 'issues' ]]; then
            gh issue comment "${{ github.event.issue.number }}" --repo "$repo" --body-file "$body_file"
          else
            issue_number="$(gh issue list --repo "$repo" --state open --search 'Green Frame Actions diagnostics in:title' --json number --jq '.[0].number // empty')"
            if [[ -z "$issue_number" ]]; then
              gh issue create --repo "$repo" --title 'Green Frame Actions diagnostics' --body-file "$body_file"
            else
              gh issue edit "$issue_number" --repo "$repo" --body-file "$body_file"
            fi
          fi

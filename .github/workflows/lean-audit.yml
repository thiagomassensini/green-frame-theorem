name: Lean kernel and repository audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: green-frame-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lean kernel build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_REF: ${{ github.event_name == 'schedule' && 'agent/formalize-all-bases-green-frame' || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact target revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build public root with warnings as errors
        id: kernel
        shell: bash
        run: |
          set +e
          lake build --wfail GreenFrame 2>&1 | tee "${RUNNER_TEMP}/green-frame-build.log"
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish scheduled audit ledger
        if: github.event_name == 'schedule' && always()
        shell: bash
        env:
          KERNEL_STATUS: ${{ steps.kernel.outputs.status }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${KERNEL_STATUS}" == "0" ]]; then
            conclusion="GREEN"
          else
            conclusion="RED"
          fi
          log_tail="$(tail -n 120 "${RUNNER_TEMP}/green-frame-build.log" || true)"
          body_file="${RUNNER_TEMP}/scheduled-audit.md"
          {
            echo "# Scheduled Green Frame kernel audit"
            echo
            echo "- Target ref: \`${TARGET_REF}\`"
            echo "- Exact commit: \`${head_sha}\`"
            echo "- Conclusion: **${conclusion}**"
            echo "- Command: \`lake build --wfail GreenFrame\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            printf '%s\n' "${log_tail}"
            echo '```'
          } > "${body_file}"
          issue_number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search 'Scheduled Green Frame kernel audit in:title' --json number --jq '.[0].number // empty')"
          if [[ -z "${issue_number}" ]]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "Scheduled Green Frame kernel audit" --body-file "${body_file}"
          else
            gh issue edit "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body-file "${body_file}"
          fi

      - name: Enforce kernel result
        if: always()
        shell: bash
        env:
          KERNEL_STATUS: ${{ steps.kernel.outputs.status }}
        run: |
          test "${KERNEL_STATUS}" = "0"

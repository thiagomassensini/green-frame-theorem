name: Lean kernel and repository audit

on:
  pull_request:
  push:
    branches:
      - main
      - audit/v1.0.0-publication-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: green-frame-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lean kernel and trust audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install elan and the project-pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake --version
          lean --version

      - name: Resolve pinned dependencies and fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Run complete publication audit
        shell: bash
        run: bash scripts/run_audits.sh

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: green-frame-audit-${{ github.run_id }}
          path: |
            audit/axioms.txt
            audit/theorem-registry.json
            audit/CLAIM_LEDGER.md
            audit/SOURCE_PROVENANCE.md
            docs/90_PAPER_SPECIFICATION.md
            lake-manifest.json
          if-no-files-found: warn
          retention-days: 30

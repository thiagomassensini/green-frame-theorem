name: Lean kernel and repository audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: green-frame-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Seven-gate Lean and release audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.AUDITED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a synthetic or dirty checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          if test "$GITHUB_EVENT_NAME" = push && test "$GITHUB_REF" = refs/heads/main; then
            test "$GITHUB_WORKFLOW_SHA" = "$AUDITED_SHA"
          fi

      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Run all seven gates and package the evidence
        shell: bash
        run: bash scripts/run_audits.sh

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if test -f audit/evidence/audit-manifest.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          manifest = json.loads(Path("audit/evidence/audit-manifest.json").read_text())
          print("# Green Frame audit")
          print()
          print(f"- commit: `{manifest['git']['commit']}`")
          print(f"- tree: `{manifest['git']['tree']}`")
          print(f"- gates: `{sum(g['status'] == 'PASS' for g in manifest['gates'])}/7 PASS`")
          for key, value in manifest["counts"].items():
              print(f"- {key}: `{value}`")
          print(f"- used axioms: `{', '.join(manifest['trust']['used_axioms'])}`")
          PY
          fi

      - name: Upload exact-SHA audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: green-frame-audit-${{ env.AUDITED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit/evidence/
            audit/axioms.txt
            dist/
          if-no-files-found: error
          retention-days: 90

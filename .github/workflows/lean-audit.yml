name: Lean kernel and repository audit

on:
  pull_request:
  push:
    branches:
      - main
      - agent/formalize-all-bases-green-frame
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: green-frame-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lean kernel build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          use-github-cache: true
          use-mathlib-cache: true
      - name: Build public root with warnings as errors
        run: lake build --wfail GreenFrame

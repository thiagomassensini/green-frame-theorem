name: Publish Green Frame v1.0.0

on:
  push:
    branches:
      - publish-v1.0.0-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-green-frame-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    name: Audit, tag, and release v1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.0
    steps:
      - name: Check out the immutable main publication target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Stop when the release already exists
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pinned Lean, dependencies, and caches
        if: steps.guard.outputs.exists != 'true'
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Run the complete publication gate
        if: steps.guard.outputs.exists != 'true'
        shell: bash
        run: bash scripts/run_audits.sh

      - name: Build the checksummed release bundle
        if: steps.guard.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/audit
          cp audit/axioms.txt dist/audit/axioms.txt
          cp audit/AXIOM_POLICY.md dist/audit/AXIOM_POLICY.md
          cp audit/CLAIM_LEDGER.md dist/audit/CLAIM_LEDGER.md
          cp audit/SOURCE_PROVENANCE.md dist/audit/SOURCE_PROVENANCE.md
          cp audit/THEOREM_REGISTRY.md dist/audit/THEOREM_REGISTRY.md
          cp audit/theorem-registry.json dist/audit/theorem-registry.json
          cp docs/90_PAPER_SPECIFICATION.md dist/TEOREMA_FRAME_GREEN_TODAS_AS_BASES.md
          cp .release/v1.0.0.md dist/RELEASE_NOTES.md
          git archive --format=tar.gz \
            --prefix=green-frame-theorem-v1.0.0/ \
            --output=dist/green-frame-theorem-v1.0.0.tar.gz HEAD
          (
            cd dist
            sha256sum \
              green-frame-theorem-v1.0.0.tar.gz \
              TEOREMA_FRAME_GREEN_TODAS_AS_BASES.md \
              audit/axioms.txt \
              audit/theorem-registry.json > SHA256SUMS.txt
          )

      - name: Create the annotated tag and GitHub release
        if: steps.guard.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --force --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          else
            git tag -a "$TAG" -F .release/v1.0.0.md
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'Green Frame Theorem v1.0.0' \
            --notes-file .release/v1.0.0.md \
            dist/green-frame-theorem-v1.0.0.tar.gz \
            dist/TEOREMA_FRAME_GREEN_TODAS_AS_BASES.md \
            dist/audit/axioms.txt \
            dist/audit/theorem-registry.json \
            dist/SHA256SUMS.txt

      - name: Verify the published release
        shell: bash
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
